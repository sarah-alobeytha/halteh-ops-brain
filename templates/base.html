<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Halteh Ops{% endblock %} · Halteh Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">H</span>
        <div class="brand-text">
          <span class="brand-name">Halteh</span>
          <span class="brand-sub">Ops Brain</span>
        </div>
      </div>
      <nav>
        <a href="{{ url_for('overview') }}" class="{{ 'active' if active=='overview' else '' }}">Overview</a>
        <a href="{{ url_for('stock_page') }}" class="{{ 'active' if active=='stock' else '' }}">Stock</a>
        <a href="{{ url_for('forecast_page') }}" class="{{ 'active' if active=='forecast' else '' }}">Forecast</a>
        <a href="{{ url_for('reorder_page') }}" class="{{ 'active' if active=='reorder' else '' }}">Reorder</a>
        <a href="{{ url_for('customers_page') }}" class="{{ 'active' if active=='customers' else '' }}">Customers</a>
      </nav>
      <div class="sidebar-foot">
        <span>Plants pilot · sample data</span>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
